name: Deploy published Daily Word
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate explicit publications and site content
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/publications.json").read_text(encoding="utf-8"))

          if data.get("schemaVersion") != 1:
              raise SystemExit("Wrong publication schema.")
          published = data.get("published")
          scheduled = data.get("dailySchedule")
          if not isinstance(published, list) or not isinstance(scheduled, list):
              raise SystemExit("Published and dailySchedule must be arrays.")
          raw = Path("app.js").read_text(encoding="utf-8")
          if not raw.startswith("const DATA=") or ";\n" not in raw:
              raise SystemExit("Missing static app DATA.")
          app = json.loads(raw.split(";\n", 1)[0].removeprefix("const DATA="))
          entries = {x["id"]: x for x in app["entries"]}
          index = {x["id"]: x for x in app["index"]}
          seen = set()
          for item in published:
              sid = item.get("session_id")
              if not sid or sid in seen or item.get("status") != "PUBLISHED":
                  raise SystemExit("Duplicate or unapproved publication.")
              seen.add(sid)
              if sid not in entries or sid not in index or not index[sid].get("available"):
                  raise SystemExit(f"Published session {sid} is not readable in the app.")
              entry = entries[sid]
              if not entry.get("verses") or not entry.get("sections") or not entry.get("sources"):
                  raise SystemExit(f"Published session {sid} lacks required content.")
              if item.get("doc_url") != index[sid].get("doc"):
                  raise SystemExit(f"Published Doc mismatch for {sid}.")
          for item in scheduled:
              if item.get("session_id") not in seen:
                  raise SystemExit("Schedule references unpublished material.")
          forbidden = ["preview.html", "preview-data.js", "QT_Pilot_3_Tracks_v1.md"]
          if any(Path(x).exists() for x in forbidden):
              raise SystemExit("Deployment blocked: unapproved draft or preview file found.")
          allowed = ["index.html", "style.css", "app.js", "manifest.webmanifest",
                     "assets/icon.svg", "data/publications.json", "sync-client.js", "sync-config.js"]
          for x in allowed:
              if not Path(x).is_file():
                  raise SystemExit(f"Missing required file: {x}")
          from shutil import copy2
          root = Path("_site")
          root.mkdir(exist_ok=True)
          for x in allowed:
              dest = root / x
              dest.parent.mkdir(parents=True, exist_ok=True)
              copy2(x, dest)
          (root / ".nojekyll").write_text("")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload approved static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
